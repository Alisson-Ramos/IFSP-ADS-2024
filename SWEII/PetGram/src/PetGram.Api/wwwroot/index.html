<!DOCTYPE html>
<!--
  PetGram — Rede social de animais
  Trabalho Prático 04 — CBTSWE2 — ADS 671 — IFSP Campus Cubatão
  Prof. Wellington Tuler Moraes
  Autores: Alisson Ramos Aquino dos Santos e Nayara Pereira Soares
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Alisson Ramos Aquino dos Santos, Nayara Pereira Soares">
  <title>PetGram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <div class="topo-conteudo">
      <h1 class="logo">PetGram</h1>
      <nav class="acoes">
        <button class="icone" id="btnNovoPost" title="Novo post" aria-label="Novo post">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
        </button>
        <button class="icone" id="btnPets" title="Gerenciar pets" aria-label="Gerenciar pets">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Stories: um círculo por pet; clicar filtra o feed -->
    <section class="stories" id="stories" aria-label="Pets"></section>

    <div class="filtro" id="filtro" hidden>
      <span id="filtroTexto"></span>
      <button class="link" id="btnLimparFiltro">Ver todos</button>
    </div>

    <section id="feed" class="feed" aria-live="polite"></section>
  </main>

  <footer class="rodape">
    <p><strong>PetGram</strong> · Trabalho Prático 04 · CBTSWE2 – ADS 671 · IFSP Campus Cubatão</p>
    <p>Alisson Ramos Aquino dos Santos e Nayara Pereira Soares</p>
    <p><a href="/swagger" target="_blank">Documentação da API (Swagger)</a></p>
  </footer>

  <!-- Modal: criar / editar post -->
  <dialog id="modalPost" class="modal">
    <form id="formPost" method="dialog">
      <header class="modal-topo">
        <button type="button" class="link" data-fechar>Cancelar</button>
        <h2 id="tituloModalPost">Novo post</h2>
        <button type="submit" class="link forte">Compartilhar</button>
      </header>
      <div class="modal-corpo">
        <input type="hidden" id="postId">
        <label>Pet
          <select id="postPet" required></select>
        </label>
        <label>URL da imagem
          <input type="url" id="postImagem" placeholder="https://...">
        </label>
        <div class="previa" id="previaPost"></div>
        <label>Legenda
          <textarea id="postLegenda" rows="4" maxlength="2200" placeholder="Escreva uma legenda... use #hashtags"></textarea>
        </label>
        <small class="contador"><span id="contadorLegenda">0</span>/2.200</small>
        <ul class="erros" id="errosPost"></ul>
      </div>
    </form>
  </dialog>

  <!-- Modal: CRUD de pets -->
  <dialog id="modalPets" class="modal largo">
    <header class="modal-topo">
      <span></span>
      <h2>Pets</h2>
      <button type="button" class="link" data-fechar>Fechar</button>
    </header>
    <div class="modal-corpo duas-colunas">
      <ul class="lista-pets" id="listaPets"></ul>

      <form id="formPet" class="form-pet">
        <h3 id="tituloFormPet">Novo pet</h3>
        <input type="hidden" id="petId">
        <label>Nome
          <input id="petNome" maxlength="40" required>
        </label>
        <label>Usuário
          <div class="prefixo"><span>@</span><input id="petUsuario" maxlength="30" required placeholder="thor.caramelo"></div>
        </label>
        <label>Espécie
          <select id="petEspecie" required>
            <option>Cachorro</option>
            <option>Gato</option>
            <option>Pássaro</option>
            <option>Coelho</option>
            <option>Peixe</option>
            <option>Hamster</option>
            <option>Outro</option>
          </select>
        </label>
        <label>Raça
          <input id="petRaca" maxlength="50">
        </label>
        <label>Bio
          <textarea id="petBio" rows="2" maxlength="150"></textarea>
        </label>
        <label>URL da foto de perfil
          <input type="url" id="petFoto" placeholder="https://...">
        </label>
        <ul class="erros" id="errosPet"></ul>
        <div class="botoes">
          <button type="button" class="botao secundario" id="btnCancelarPet" hidden>Cancelar edição</button>
          <button type="submit" class="botao">Salvar</button>
        </div>
      </form>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/app.js"></script>
</body>
</html>
